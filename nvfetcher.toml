[equibop]
src.git = "https://github.com/Equicord/Equicord"
src.branch = "main"
fetch.github = "Equicord/Equicord"

[cord-nvim]
src.github_tag = "vyfor/cord.nvim"
fetch.github = "vyfor/cord.nvim"
cargo_lock = ["Cargo.lock"]

[unfetch]
src.git = "https://codeberg.org/ungo/unfetch"
src.branch = "main"
fetch.git = "https://codeberg.org/ungo/unfetch"

[nano-ffmpeg]
src.git = "https://github.com/dgr8akki/nano-ffmpeg.git"
src.branch = "main"
fetch.github = "dgr8akki/nano-ffmpeg"

[g]
src.git = "https://codeberg.org/ungo/g"
src.branch = "main"
fetch.git = "https://codeberg.org/ungo/g"

[cavemem]
src.github_tag = "JuliusBrussee/cavemem"
fetch.github = "JuliusBrussee/cavemem"

[typescript-svelte-plugin]
src.manual = "0.3.52"
fetch.url = "https://registry.npmjs.org/typescript-svelte-plugin/-/typescript-svelte-plugin-$ver.tgz"

[fallow]
src.github_tag = "fallow-rs/fallow"
fetch.github = "fallow-rs/fallow"
cargo_lock = ["Cargo.lock"]

[grompt]
src.git = "https://codeberg.org/estebxn/grompt"
src.branch = "master"
fetch.git = "https://codeberg.org/estebxn/grompt"

[graphify]
src.github_tag = "safishamsi/graphify"
fetch.github = "safishamsi/graphify"
src.exclude_regex = "^v?1\\.0\\.0$"    # 1.0.0 is actually the oldest version

# bump: edit version, run nvfetcher, regenerate packages/tersio-package-lock.json, refresh npmDepsHash
[tersio]
src.manual = "2.25.4"
fetch.url = "https://registry.npmjs.org/@krtclcdy/tersio/-/tersio-$ver.tgz"

[symposium]
src.github_tag = "symposium-dev/symposium"
src.include_regex = "^symposium-v.*"
fetch.github = "symposium-dev/symposium"
cargo_lock = ["Cargo.lock"]

# no release since v0.1.1 (an ACP proxy); main is the pure stdio MCP server
[symposium-rust-analyzer]
src.git = "https://github.com/symposium-dev/symposium-rust-analyzer"
src.branch = "main"
fetch.github = "symposium-dev/symposium-rust-analyzer"
cargo_lock = ["Cargo.lock"]

# 6.8.0 needs Node >=24.22.1/26.12.1; nixpkgs has 24.21.0. Bump when nixpkgs catches up.
# bump: edit version, run nvfetcher, regenerate packages/rea-package-lock.json, refresh npmDepsHash
[rea]
src.manual = "6.7.0"
fetch.url = "https://registry.npmjs.org/rea-agents/-/rea-agents-$ver.tgz"

[seanime-denshi]
src.github = "5rahim/seanime"
src.prefix = "v"
fetch.url = "https://github.com/5rahim/seanime/releases/download/v$ver/seanime-denshi-$ver_Linux_x86_64.AppImage"
