name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency: security

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan every package
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          failed=()
          for a in $(scripts/list.sh); do
            if ! scripts/vulns.sh scan "$a" > "$RUNNER_TEMP/v.json"; then failed+=("$a"); continue; fi
            n=$(jq length "$RUNNER_TEMP/v.json")
            if [ "$n" -gt 0 ]; then
              {
                printf 'Known advisories in `%s` as shipped on main. Updating the package usually fixes them; npm lockfiles in `packages/` are regenerated by `scripts/update.sh`.\n\n' "$a"
                scripts/vulns.sh table "$RUNNER_TEMP/v.json"
              } > "$RUNNER_TEMP/body.md"
              scripts/issue.sh upsert security "$a" "$a: $n known advisories" "$RUNNER_TEMP/body.md"
            else
              scripts/issue.sh close security "$a" "No known advisories as of $(date -u +%F)."
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "scan failed for: ${failed[*]}" >&2; exit 1; fi
