name: update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      attr:
        description: Only update this package (empty = all)
        required: false
      soak_days:
        description: Days an update PR waits before landing (0 = land in this run)
        required: false
        default: "3"

concurrency: update

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SOAK_DAYS: ${{ inputs.soak_days || '3' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      attrs: ${{ steps.list.outputs.attrs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
      - id: list
        env:
          ATTR_INPUT: ${{ inputs.attr }}
        run: |
          if [ -n "$ATTR_INPUT" ]; then list=$ATTR_INPUT; else list=$(nix develop -c scripts/list.sh updatable); fi
          echo "attrs=$(jq -R -s -c 'split("\n") | map(select(. != ""))' <<<"$list")" >> "$GITHUB_OUTPUT"

  # one job per package: bump, build, scan; a passing bump becomes a PR, a failing one an issue
  package:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.list.outputs.attrs) }}
    env:
      ATTR: ${{ matrix.attr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # an open PR lands (or is closed) before a newer version is tried, so every shipped version soaks
      - id: pending
        run: echo "pr=$(gh pr list --head "update/$ATTR" --state open --json url --jq '.[0].url // ""')" >> "$GITHUB_OUTPUT"
      - id: update
        if: steps.pending.outputs.pr == ''
        continue-on-error: true
        run: UPDATE_RESULT="$GITHUB_OUTPUT" UPDATE_REPORT="$RUNNER_TEMP/report.md" nix develop -c scripts/update.sh "$ATTR"
      - name: Publish
        if: steps.pending.outputs.pr == ''
        shell: nix develop -c bash -euo pipefail {0}
        env:
          STATUS: ${{ steps.update.outputs.status }}
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
          STAGE: ${{ steps.update.outputs.stage }}
        run: |
          report=$RUNNER_TEMP/report.md
          case $STATUS in
          updated)
            git push -q -f origin "HEAD:refs/heads/update/$ATTR"
            {
              echo "Lands on the first daily run at least $SOAK_DAYS days after this commit, if it still builds on main and no advisories new to this version were published. To hold \`$ATTR\`, add it to the exclusion regex in \`scripts/list.sh\` and close this PR."
              echo
              cat "$report"
            } > "$RUNNER_TEMP/pr.md"
            gh label create auto-update --color 0e8a16 --description "Bot update PR; lands after the soak" >/dev/null 2>&1 || true
            url=$(gh pr create --base main --head "update/$ATTR" --label auto-update --title "$ATTR: $OLD -> $NEW" --body-file "$RUNNER_TEMP/pr.md")
            scripts/issue.sh close update-blocked "$ATTR" "Superseded by $url."
            ;;
          uptodate)
            scripts/issue.sh close update-blocked "$ATTR" "Resolved: \`$ATTR\` is up to date at $OLD."
            ;;
          deferred)
            echo "::notice::$ATTR: $NEW deferred, an npm dependency is newer than the $SOAK_DAYS-day cutoff"
            ;;
          failed)
            if [ "$NEW" = "$OLD" ]; then title="$ATTR: update blocked at $STAGE"; else title="$ATTR: update to $NEW blocked at $STAGE"; fi
            scripts/issue.sh upsert update-blocked "$ATTR" "$title" "$report"
            ;;
          *)
            echo "scripts/update.sh ended without a status; see the update step" >&2
            exit 1
            ;;
          esac

  # nixpkgs bump: lands only if every package still builds; otherwise one issue lists what broke
  flake-lock:
    if: inputs.attr == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - run: nix flake update
      - name: Build everything against the new nixpkgs, then push
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          if git diff --quiet flake.lock; then echo "flake.lock up to date"; exit 0; fi
          broken=()
          for a in $(scripts/list.sh); do
            if ! nix build -L --no-link ".#legacyPackages.x86_64-linux.$a" 2>&1 | tee "$RUNNER_TEMP/log"; then
              broken+=("$a")
              {
                printf '### `%s`\n\n' "$a"
                scripts/hints.sh "$RUNNER_TEMP/log"
                printf '\n```\n%s\n```\n\n' "$(tail -n 40 "$RUNNER_TEMP/log" | sed 's/\x1b\[[0-9;]*m//g')"
              } >> "$RUNNER_TEMP/report.md"
            fi
          done
          if [ ${#broken[@]} -gt 0 ]; then
            scripts/issue.sh upsert update-blocked flake.lock "flake.lock: nixpkgs update breaks ${broken[*]}" "$RUNNER_TEMP/report.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "flake.lock: update nixpkgs"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              scripts/issue.sh close update-blocked flake.lock "nixpkgs update landed."
              exit 0
            fi
            sleep $((RANDOM % 10 + 2))
          done
          exit 1

  # after package and flake-lock, so writes to main never race
  promote:
    needs: [package, flake-lock]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Land soaked update PRs
        env:
          ATTR_INPUT: ${{ inputs.attr }}
        run: nix develop -c scripts/promote.sh
