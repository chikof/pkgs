name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix develop -c alejandra --check .
      - name: Flake
        run: nix flake check --no-build

  # only attrs whose derivation differs from the base are built; an unknown base (new branch, dispatch) builds all
  list:
    runs-on: ubuntu-latest
    outputs:
      attrs: ${{ steps.list.outputs.attrs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          list=$(nix develop -c scripts/changed.sh "$BASE")
          echo "attrs=$(jq -R -s -c 'split("\n")[:-1]' <<<"$list")" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    if: needs.list.outputs.attrs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.list.outputs.attrs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # rea pulls ghidra, chromium, jdk...: the runner disk is too small without this
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      # flake output, so a broken flake wiring fails here too
      - name: Build
        run: nix build -L --no-link ".#legacyPackages.x86_64-linux.${{ matrix.attr }}"
